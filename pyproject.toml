[project]
name = "talk"
version = "0.1.0"
description = "Ditado por voz 100% local: grava do microfone e transcreve na GPU"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "local-ai", "voice-typing", "qwen-asr"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9",
    "sounddevice>=0.5.5",
]

[project.optional-dependencies]
# Palavra-chave ("hey jarvis"). Opcional de propósito: o openWakeWord importa
# scipy e scikit-learn no topo do módulo — ~55 MB para um treinador de
# verificadores que este projeto não usa. Quem dita só por atalho não paga.
wake = [
    "openwakeword==0.6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    # onnxruntime e tqdm já entram como transitivos do faster-whisper
]

# Leitura em voz alta. Opcional: são centenas de MB de modelo que só servem a
# quem usa o recurso. Os dois motores rodam na CPU e não disputam VRAM com o
# Whisper nem com o LLM.
#
# kokoro é o padrão — venceu um teste cego pareado contra o Piper. voz-leve
# instala o Piper, que soa mais sintético mas ocupa 61 MB por voz em vez de
# 347 MB e sintetiza ~25x o tempo real em vez de ~4,5x: é a escolha certa em
# máquina fraca, e um bom ponto de partida para reaproveitar em outro projeto.
voz = ["kokoro-onnx>=0.5.0"]
voz-leve = ["piper-tts>=1.4.2"]

# Test runner. Opcional de propósito: `uv run pytest` needs it, the installed
# app never imports it.
test = ["pytest>=8.4"]

# Qwen3-ASR — the alternative transcription engine. Optional on purpose: ~4 GB of
# weights plus torch, and an engine asked for without its packages says which
# extra is missing instead of crashing on import.
#
# No versions pinned on purpose: uv resolves the latest, and a pin guessed from
# a doc is worse than no pin. Caveat when you do sync: the default PyPI torch
# wheel is the +cpu one. The CUDA build comes from the pytorch index wired at
# the bottom of this file, whose name carries the CUDA version the driver
# reports (see [tool.uv.index] and [tool.uv.sources]).
qwen = ["qwen-asr", "transformers", "torch"]

# Desktop GUI (configurator + live panel). Optional on purpose: the app stays
# usable from the CLI alone, and PySide6 is ~30 MB of Qt.
gui = ["pyside6"]

[tool.pytest.ini_options]
# The real-engine smoke test is opt-in: it downloads ~4 GB and needs a GPU, so
# the default run must not reach it. `-m asr` on the command line overrides.
addopts = "-m 'not asr'"
markers = [
    "asr: real Qwen3-ASR smoke test, opt-in with -m asr",
]

[project.scripts]
talk = "talk.cli:main"

# The CUDA torch wheel: the number in the index name is the CUDA version the
# driver reports (nvidia-smi prints it), not a torch release. PyPI alone would
# give the +cpu build, which leaves the qwen engine crawling on the CPU.
# explicit = true keeps PyPI the default for every other package.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

# O openwakeword 0.6.0 declara tflite-runtime no Linux. Esse pacote parou na
# 2.14.0 (out/2023) e nunca teve wheel para cp312: sem isto a resolução falha
# antes de baixar qualquer coisa. Os modelos rodam em ONNX
# (inference_framework="onnx") e o tflite jamais é importado — então esta não é
# uma gambiarra, é a descrição correta do que usamos do pacote.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk"]
