[project]
name = "talk"
version = "0.1.0"
description = "Ditado por voz 100% local: grava, transcreve com Whisper na GPU e limpa com um LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "local-ai", "voice-typing"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9",
    "sounddevice>=0.5.5",
]

[project.optional-dependencies]
# Palavra-chave ("hey jarvis"). Opcional de propósito: o openWakeWord importa
# scipy e scikit-learn no topo do módulo — ~55 MB para um treinador de
# verificadores que este projeto não usa. Quem dita só por atalho não paga.
wake = [
    "openwakeword==0.6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    # onnxruntime e tqdm já entram como transitivos do faster-whisper
]

[project.scripts]
talk = "talk.cli:main"

# O openwakeword 0.6.0 declara tflite-runtime no Linux. Esse pacote parou na
# 2.14.0 (out/2023) e nunca teve wheel para cp312: sem isto a resolução falha
# antes de baixar qualquer coisa. Os modelos rodam em ONNX
# (inference_framework="onnx") e o tflite jamais é importado — então esta não é
# uma gambiarra, é a descrição correta do que usamos do pacote.
[[tool.uv.dependency-metadata]]
name = "openwakeword"
version = "0.6.0"
requires-dist = [
    "onnxruntime>=1.10.0,<2",
    "tqdm>=4.0,<5.0",
    "scipy>=1.3,<2",
    "scikit-learn>=1,<2",
    "requests>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk"]
