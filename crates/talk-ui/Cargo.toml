[package]
name = "talk-ui"
description = "A janela do talk: ajustes, histórico e vocabulário, num webview que só existe enquanto está aberta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "talk-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
talk-core = { path = "../talk-core" }
tao = "0.37"
wry = { version = "0.57", features = ["linux-body"] }
