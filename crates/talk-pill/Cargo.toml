[package]
name = "talk-pill"
description = "A pílula de gravação: layer-shell no canto da tela, sem foco, só enquanto o talk grava."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "talk-pill"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
serde_json = "1"
tiny-skia = "0.12"
talk-core = { path = "../talk-core" }

[target.'cfg(unix)'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[target.'cfg(windows)'.dependencies]
anyhow = "1"
uds_windows = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
