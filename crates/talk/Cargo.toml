[package]
name = "talk"
description = "O serviço de ditado: atalho, microfone, Whisper na GPU, texto no cursor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "talk-rs"
path = "src/main.rs"

# Só faz sentido no Windows: sobe o serviço sem piscar janela (o login chama este).
[[bin]]
name = "talk-start"
path = "src/start.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
talk-core = { path = "../talk-core" }
tiny_http = "0.12"
whisper-rs = { version = "0.16", features = ["cuda"] }

[target.'cfg(unix)'.dependencies]
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
evdev = "0.13"
nix = { version = "0.30", features = ["signal"] }
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
arboard = "3"
cpal = "0.18"
enigo = "0.6"
memory-stats = "1"
notify-rust = "4"
sha2 = "0.10"
tao = "0.37"
tray-icon = "0.26"
uds_windows = "1"
windows-hotkeys = "0.2"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
